---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: payment-service
  labels:
    name: payment-service

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: payment-service
  labels:
    app: payment-authorization
    version: "1.0.0"
data:
  application.yml: |
    spring:
      jpa:
        hibernate:
          ddl-auto: validate
      datasource:
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
      kafka:
        producer:
          compression-type: snappy
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
    
    fraud:
      strategy: basic

---
# Secret (use sealed-secrets or external-secrets in production)
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: payment-service
  labels:
    app: payment-authorization
type: Opaque
data:
  # base64 encoded values - ONLY FOR DEMO!
  # In production use: sealed-secrets, vault, or AWS Secrets Manager
  db-password: cGF5bWVudF9wYXNzd29yZA==  # payment_password
  jwt-secret: and0X3NlY3JldF9rZXk=         # jwt_secret_key

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-sa
  namespace: payment-service
  labels:
    app: payment-authorization

---
# Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-role
  namespace: payment-service
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-rolebinding
  namespace: payment-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: payment-role
subjects:
  - kind: ServiceAccount
    name: payment-sa
    namespace: payment-service

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-authorization
  namespace: payment-service
  labels:
    app: payment-authorization
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment-authorization

  template:
    metadata:
      labels:
        app: payment-authorization
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/metrics"

    spec:
      serviceAccountName: payment-sa

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # Init container - wait for dependencies
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres.payment-service.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-kafka
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z kafka.payment-service.svc.cluster.local 9092; do echo waiting for kafka; sleep 2; done;']

      containers:
      - name: payment-authorization
        image: registry.example.com/fiserv/payment-authorization:1.0.0
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: actuator
          containerPort: 8080
          protocol: TCP

        # Environment variables
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75 -Duser.timezone=UTC"

        # Database config
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres.payment-service.svc.cluster.local:5432/payment_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "payment_user"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-secrets
              key: db-password

        # Kafka config
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.payment-service.svc.cluster.local:9092"

        # Fraud strategy
        - name: FRAUD_STRATEGY
          valueFrom:
            configMapKeyRef:
              name: payment-config
              key: FRAUD_STRATEGY
              optional: true

        # Resource requests and limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        # Health checks
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Volume mounts
        volumeMounts:
        - name: logs
          mountPath: /var/log/payment-authorization
        - name: config
          mountPath: /config
          readOnly: true

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        # Logging
        stdout: /dev/stdout
        stderr: /dev/stderr

      # Volumes
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: payment-config

      # Pod disruption budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - payment-authorization
              topologyKey: kubernetes.io/hostname

      # Topology spread constraints (K8s 1.19+)
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: payment-authorization

      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: payment-authorization
  namespace: payment-service
  labels:
    app: payment-authorization
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: payment-authorization

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-hpa
  namespace: payment-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-authorization
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-pdb
  namespace: payment-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-authorization

---
# NetworkPolicy (Restrict traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-netpol
  namespace: payment-service
spec:
  podSelector:
    matchLabels:
      app: payment-authorization
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 9092  # Kafka

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-ingress
  namespace: payment-service
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - payment-api.example.com
    secretName: payment-tls-cert
  rules:
  - host: payment-api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payment-authorization
            port:
              number: 8080

---
# ServiceMonitor (for Prometheus, if using)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-monitor
  namespace: payment-service
  labels:
    app: payment-authorization
spec:
  selector:
    matchLabels:
      app: payment-authorization
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s

